[workspace]
resolver = "2"
members = [
    "crates/fineract-core",
    "crates/fineract-client", 
    "crates/fineract-loan",
    "crates/fineract-savings",
    "crates/fineract-accounting",
    "crates/fineract-reporting",
    "crates/fineract-api",
    "crates/fineract-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["Fineract Migration Team"]
license = "MIT"
repository = "https://github.com/your-org/fineract-rust"
homepage = "https://github.com/your-org/fineract-rust"
description = "Modern Rust implementation of Apache Fineract microfinance platform"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.12"

# Web framework
axum = { version = "0.7.7", features = ["multipart", "ws"] }
tower = "0.5.1"
tower-http = { version = "0.6.1", features = ["full"] }
hyper = "1.4.1"

# Database
diesel = { version = "2.1.4", features = ["postgres", "uuid", "chrono", "serde_json", "numeric"] }
diesel-async = { version = "0.4.1", features = ["postgres", "deadpool"] }
deadpool-diesel = { version = "0.5.0", features = ["postgres"] }

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
uuid = { version = "1.10.0", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4.38", features = ["serde"] }
time = { version = "0.3.36", features = ["serde", "macros", "parsing", "formatting"] }

# Error handling
thiserror = "1.0.65"
anyhow = "1.0.89"
color-eyre = "0.6.3"

# Logging and tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22.0"

# Validation
validator = { version = "0.18.1", features = ["derive"] }

# Security
argon2 = "0.5.3"
jsonwebtoken = "9.3.0"
rand = "0.8.5"

# Configuration
config = "0.14.0"
dotenvy = "0.15.7"

# HTTP client
reqwest = { version = "0.12.8", features = ["json", "multipart"] }

# Testing
proptest = "1.5.0"
testcontainers = "0.22.0"
fake = { version = "2.10.0", features = ["derive", "chrono", "uuid"] }

# Utilities
once_cell = "1.20.1"
futures = "0.3.30"
bytes = "1.7.2"
mime = "0.3.17"

# Metrics and monitoring
metrics = "0.23.0"
metrics-exporter-prometheus = "0.15.3"

# OpenAPI
utoipa = { version = "4.2.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum"] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "off"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
strip = true

[profile.test]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256

# Performance optimizations for dependencies
[profile.dev.package."*"]
opt-level = 2

[profile.release.package."*"]
opt-level = 3