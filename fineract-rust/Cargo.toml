[package]
name = "fineract-rust"
version = "0.1.0"
edition = "2021"
authors = ["Apache Fineract Contributors"]
description = "Apache Fineract - Financial Inclusion Platform (Rust Implementation)"
license = "Apache-2.0"
repository = "https://github.com/apache/fineract"
keywords = ["financial", "microfinance", "banking", "api"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# Web Framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1.0", features = ["full"] }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Database
diesel = { version = "2.1", features = ["postgres", "chrono", "uuid", "serde_json"] }
diesel_migrations = "2.1"
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
dotenv = "0.15"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Security
bcrypt = "0.15"
jsonwebtoken = "9.2"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# Utilities
regex = "1.0"
url = "2.4"
percent-encoding = "2.3"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"

[features]
default = ["postgres"]
postgres = ["diesel/postgres"]
mysql = ["diesel/mysql"]
sqlite = ["diesel/sqlite"]

[[bin]]
name = "fineract-rust"
path = "src/main.rs"
